name: Collecte et publication

on:
  schedule:
    - cron: '*/15 * * * *'   # GitHub peut retarder les passages de quelques minutes
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Un seul passage à la fois : un nouveau passage attend la fin du précédent au lieu de l'écraser.
concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Collecter, fusionner avec le relevé du PC, publier (branche data)
        env:
          GIT_AUTHOR_NAME: pokeradar-bot
          GIT_AUTHOR_EMAIL: pokeradar-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: pokeradar-bot
          GIT_COMMITTER_EMAIL: pokeradar-bot@users.noreply.github.com
        run: node collector/sync.mjs

      - name: Mettre le relevé fusionné dans l'appli
        run: cp collector/data/veille.json collector/data/evenements.json collector/data/sante.json app/

      - name: Journal du passage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: collector/logs/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  publication:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
