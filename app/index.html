<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f3fb">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Le carnet de veille des collectionneurs Pokémon JCC.">
  <link rel="icon" href="./assets/radar.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/radar-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>PokéRadar · Carnet de veille JCC</title>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="#accueil" aria-label="PokéRadar, accueil">
        <img src="./assets/radar.svg" width="42" height="42" alt="">
        <span>PokéRadar <small>Carnet de veille JCC</small></span>
      </a>
      <nav id="navigation" class="navigation" aria-label="Navigation principale"></nav>
      <div class="rail-note"><span class="live-dot"></span> Carnet sur cet appareil</div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a class="brand mobile-brand" href="#accueil" aria-label="PokéRadar, accueil">
          <img src="./assets/radar.svg" width="34" height="34" alt=""> PokéRadar
        </a>
        <span id="breadcrumb">Vue d’ensemble</span>
        <a class="top-link" href="#donnees" id="data-link">Mes données</a>
      </header>
      <main id="main" tabindex="-1">
        <div id="storage-error" class="notice warning" hidden></div>
        <div class="watch-bar">
          <div>
            <strong>Veille Pokémon</strong>
            <p id="watch-status" class="mini muted" role="status">Chargement du dernier relevé…</p>
          </div>
          <button class="button secondary" id="watch-refresh" type="button" aria-describedby="watch-status">Actualiser</button>
        </div>
        <div id="screen"><p>Ouverture du carnet…</p></div>
        <noscript>Active JavaScript pour ouvrir ton carnet PokéRadar.</noscript>
        <footer>Projet indépendant consacré au JCC Pokémon.</footer>
      </main>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="editor-title"></dialog>
  <div class="feedback" role="status" id="feedback"></div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
